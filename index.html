
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رباط للتسوق</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #176b45;
      color: white;
      text-align: center;
      padding: 24px 12px;
    }
    main {
      padding: 20px;
      text-align: center;
    }
    .shop {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    button {
      background: #176b45;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>رباط للتسوق</h1>
    <p>محلك من الشعبية - سرت</p>
  </header>
  <main>
    <div class="shop">
      <h2>مرحباً بيكم</h2>
      <p>تسوقوا منتجاتنا، والتوصيل داخل سرت وضواحيها.</p>
      <p>الدفع عند الاستلام</p>
      <button onclick="alert('قريباً ستتوفر المنتجات وطلبات الشراء')">
        تسوق الآن
      </button>
    </div>
  </main>
</body>
</html>
